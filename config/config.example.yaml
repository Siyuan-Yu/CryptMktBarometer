# =============================================================================
# 配置文件模板 — 复制为 config/config.yaml 后按需修改
# 注意：config.yaml 已加入 .gitignore，请勿将密钥提交到版本库
# =============================================================================

# Flask Web 服务
web:
  host: "127.0.0.1"          # 本机访问；第六步可改为 0.0.0.0 以支持局域网
  port: 5000
  debug: false
  page_auto_refresh_seconds: 0
  price_refresh_seconds: 5
  price_cache_seconds: 4
  dashboard_refresh_seconds: 30

# 定时轮询（第二步启用）
scheduler:
  enabled: true
  interval_minutes: 10       # 正式：拉取间隔（分钟）
  interval_seconds: 0        # 测试：>0 时优先，如 5 表示每 5 秒拉取

# 数据存储
storage:
  log_dir: "data/logs"       # CSV 历史日志目录

collector:
  request_timeout_sec: 15
  news_max_age_days: 3
  onchain_sync_hours: 4
  community_sync_hours: 4
  community_max_items: 25
  rss_max_items: 30
  rss_macro_max_items: 20
  rss:
    coindesk: "https://www.coindesk.com/arc/outboundfeeds/rss/"
    theblock: "https://www.theblock.co/rss.xml"
    bitcoin_magazine: "https://bitcoinmagazine.com/.rss/full/"
    bitcoin_core: "https://bitcoincore.org/en/rss.xml"
    glassnode: "https://insights.glassnode.com/rss/"
    grayscale: "https://grayscale.com/feed/"
    ark_invest: "https://ark-funds.com/feed"
    sec_btc: "https://www.sec.gov/news/pressreleases.rss"
    bankless: "https://www.bankless.com/feed"
    the_defiant: "https://thedefiant.io/feed"
    ethereum_magicians: "https://ethereum-magicians.org/latest.rss"
    optimism_gov: "https://gov.optimism.io/latest.rss"
    cointelegraph_arbitrum: "https://cointelegraph.com/rss/tag/arbitrum"
    cointelegraph_optimism: "https://cointelegraph.com/rss/tag/optimism"
    solana: "https://solana.com/news/rss.xml"
    solana_blog: "https://solana.com/news/rss.xml"
    solana_status: "https://status.solana.com/history.rss"
    marinade: "https://marinade.finance/blog/rss.xml"
    cointelegraph_sol: "https://cointelegraph.com/rss/tag/solana"
    cointelegraph_fantom: "https://cointelegraph.com/rss/tag/fantom"
    ethereum_blog: "https://blog.ethereum.org/feed.xml"
    ethresearch: "https://ethresear.ch/latest.rss"
  rss_macro:
    blockworks: "https://blockworks.co/feed"
    decrypt: "https://decrypt.co/feed"
    cointelegraph_policy: "https://cointelegraph.com/rss/tag/regulation"
    fed: "https://www.federalreserve.gov/feeds/press_all.xml"
    bls: "https://www.bls.gov/feed/bls_latest.rss"
    fred_blog: "https://fredblog.stlouisfed.org/feed/"
    sec: "https://www.sec.gov/news/pressreleases.rss"
    reuters: "https://feeds.reuters.com/reuters/businessNews"
    bloomberg: "https://feeds.bloomberg.com/markets/news.rss"
    cnbc: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=100003114"
    wsj: "https://feeds.a.dj.com/rss/RSSMarketsMain.xml"
    marketwatch: "https://feeds.marketwatch.com/marketwatch/topstories/"
    ft: "https://www.ft.com/rss/home"
    benzinga: "https://www.benzinga.com/news/feed"
    wallstreetcn: "https://rss.wallstreetcn.com/"

# ---------------------------------------------------------------------------
# API 密钥（第三步起逐步使用，暂无密钥可留空）
# ---------------------------------------------------------------------------
api_keys:
  fred: ""                   # FRED 宏观数据 https://fred.stlouisfed.org/docs/api/api_key.html
  cryptopanic: ""            # CryptoPanic 资讯
  coinglass: ""              # CoinGlass 资金数据
  dune: ""
  cfgi: ""                      # https://cfgi.io/developer 单币种恐慌（主源）
  gate: ""                      # 预留 Gate ETH 恐慌
  okx: ""                       # 预留 OKX SOL 恐慌                   # Dune Analytics

# 数据源开关（第三步对接时启用）
data_sources:
  macro:
    cme_fedwatch: true
    treasury_10y: true
    fred_calendar: true
  news:
    cryptopanic: true
    coindesk: true
    theblock: true
    bitcoin_magazine: true
    bitcoin_core: true
    glassnode: true
    grayscale: true
    ark_invest: true
    sec_btc: true
    bankless: true
    the_defiant: true
    ethereum_magicians: true
    optimism_gov: true
    cointelegraph_arbitrum: true
    cointelegraph_optimism: true
    solana: true
    solana_blog: true
    solana_status: true
    marinade: true
    cointelegraph_sol: true
    cointelegraph_fantom: true
    ethereum_blog: true
    ethresearch: true
    blockworks: true
    decrypt: true
    cointelegraph_policy: true
    macro: true            # 美股/宏观专属 RSS（与加密源分离）

community:
  rsshub_base: "https://rsshub.app"
  binance_square_use_proxy: true
  twitter_accounts:
    btc: ["Bitcoin", "saylor", "ARKInvest"]
    eth: ["ethereum", "VitalikButerin", "bankless"]
    sol: ["solana", "JupiterExchange", "marinadefinance"]

scoring:
  use_news_v2: true
  use_layered_percentile: true
  percentile_history_days: 90
  funding:
    coinglass_etf: true
    coinglass_liquidation: true
    coinglass_oi: true
  community:
    reddit: true
    twitter: true
    binance_square: true
  coin_fear:
    primary: cfgi
    multi_source_check: true
    max_deviation: 12
  cfgi:
    enabled: true
    base_url: "https://cfgi.io/api"
    period: "1d"
    use_proxy_fallback: true
    tokens:
      BTC: bitcoin
      ETH: ethereum
      SOL: solana
  gate_fear:
    enabled: false
    base_url: ""
    latest_path: ""
    history_path: ""
  okx_fear:
    enabled: false
    base_url: ""
    latest_path: ""
    history_path: ""
  onchain:
    fear_greed: true
    glassnode_signals: true
    coinmarketcap_global: true
    eth_staking: true
    solana_official: true
    dune_dashboard: false
